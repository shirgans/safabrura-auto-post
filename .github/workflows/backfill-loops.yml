name: Backfill Card Loops

# Gives lectures that already have posts the same six-second card loop the
# pipeline now cuts for new ones. Safe to re-run: posts that already have a
# loop are skipped unless 'force' says otherwise.

on:
  repository_dispatch:
    types: [backfill_loops]
  workflow_dispatch:
    inputs:
      count:
        description: 'How many recent posts to consider'
        required: false
        default: '50'
      start:
        description: 'Seconds into each lecture to cut from'
        required: false
        default: '1800'
      force:
        description: 'Recut posts that already have a loop'
        type: boolean
        required: false
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          WORDPRESS_URL=${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME=${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD=${{ secrets.WORDPRESS_APP_PASSWORD }}
          TEMP_DOWNLOAD_PATH=./temp
          FFMPEG_PATH=ffmpeg
          EOF

      - name: Cut the loops
        env:
          PYTHONPATH: ${{ github.workspace }}
          COUNT: ${{ github.event.client_payload.count || inputs.count || '50' }}
          START: ${{ github.event.client_payload.start || inputs.start || '1800' }}
          FORCE: ${{ github.event.client_payload.force || inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then FORCE_FLAG="--force"; fi
          python src/backfill_loops.py --count "$COUNT" --start "$START" $FORCE_FLAG -v
